<!DOCTYPE html>
<html lang="fr">

<head>
	<meta charset="utf-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta name="theme-color" content="#192e49">
	{% seo %}
	{% feed_meta %}
	<link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
	<link rel="icon" type="image/png" sizes="32x32" href="/assets/img/favicon-32.png">
	<link rel="apple-touch-icon" href="/assets/img/apple-touch-icon.png">
	<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/space-grotesk-var.woff2" crossorigin>
	<link rel="preload" as="font" type="font/woff2" href="/assets/fonts/plex-mono-400.woff2" crossorigin>
	<link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>

<body>
	<a class="skip-link" href="#contenu">Aller au contenu</a>
	<header class="site-header">
		<nav>
			<a class="brand" href="{{ '/' | relative_url }}">
				<img src="/assets/img/icon-192.png" alt="" width="34" height="34">
				<span class="wordmark">iFixYour<span class="accent">.Tech</span></span>
			</a>
			<div class="site-nav">
				<a href="{{ '/' | relative_url }}" {% if page.url == "/" %}aria-current="page"{% endif %}>Accueil</a>
				<a href="{{ '/journal/' | relative_url }}" {% if page.url contains "/journal" %}aria-current="page"{% endif %}>Journal</a>
			</div>
		</nav>
	</header>
	<main id="contenu">
		{{ content }}
	</main>
	<footer>
		<p><strong>iFixYourTech Sàrl</strong> · Chardonne (VD), Suisse · IDE CHE-191.972.587</p>
		<p>Contact : <a href="mailto:contact@ifixyour.tech">contact@ifixyour.tech</a> · <a href="/feed.xml">Flux RSS</a></p>
		<p>Site sans cookies ni traqueurs · ifixyour<span class="accent">.tech</span></p>
	</footer>
</body>

</html>
